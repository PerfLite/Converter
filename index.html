<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImageConverter — Конвертация изображений</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <header>
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                </div>
                <h1>ImageConverter</h1>
            </div>

        </header>

        <main>
            <!-- Upload -->
            <div class="upload-section" id="dropZone">
                <input type="file" id="fileInput" accept="image/*,.psd" hidden>
                <div class="upload-icon-wrap">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <p class="upload-text">Перетащите файл сюда или <span class="link">выберите с устройства</span></p>
                <p class="upload-hint">До 50 МБ</p>
                <div class="upload-formats">
                    <span class="format-tag">PNG</span>
                    <span class="format-tag">JPG</span>
                    <span class="format-tag">WEBP</span>
                    <span class="format-tag">GIF</span>
                    <span class="format-tag">BMP</span>
                    <span class="format-tag">SVG</span>
                    <span class="format-tag">TIFF</span>
                    <span class="format-tag">PSD</span>
                </div>
            </div>

            <!-- Editor -->
            <div class="editor" id="editor" style="display: none;">

                <div class="editor-preview">
                    <!-- Source -->
                    <div class="preview-box">
                        <div class="preview-header">
                            <span class="preview-label">Исходное</span>
                            <span class="preview-badge" id="sourceBadge">—</span>
                        </div>
                        <div class="image-wrapper">
                            <img id="sourceImage" alt="Исходное изображение">
                        </div>
                        <div class="file-info" id="sourceInfo"></div>
                    </div>

                    <!-- Arrow -->
                    <div class="arrow-wrap">
                        <div class="arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </div>
                    </div>

                    <!-- Result -->
                    <div class="preview-box">
                        <div class="preview-header">
                            <span class="preview-label">Результат</span>
                            <span class="preview-badge" id="resultBadge">—</span>
                        </div>
                        <div class="image-wrapper">
                            <img id="resultImage" alt="Результат">
                        </div>
                        <div class="file-info" id="resultInfo"></div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <div class="control-group">
                        <label for="formatSelect">Формат вывода</label>
                        <select id="formatSelect">
                            <option value="image/png">PNG</option>
                            <option value="image/jpeg" selected>JPEG</option>
                            <option value="image/webp">WebP</option>
                        </select>
                    </div>

                    <div class="control-group" id="qualityGroup">
                        <div class="quality-header">
                            <span>Качество</span>
                            <span class="quality-val"><span id="qualityValue">100</span>%</span>
                        </div>
                        <input type="range" id="qualityRange" min="1" max="100" value="100">
                    </div>

                    <div class="control-group resize-controls">
                        <label class="checkbox-label">
                            <input type="checkbox" id="resizeCheck">
                            <span>Изменить размер</span>
                        </label>
                        <div class="resize-inputs" id="resizeInputs" style="display: none;">
                            <div class="dimension-input">
                                <label>Ширина</label>
                                <input type="number" id="widthInput" min="1">
                            </div>
                            <div class="dimension-separator">×</div>
                            <div class="dimension-input">
                                <label>Высота</label>
                                <input type="number" id="heightInput" min="1">
                            </div>
                            <label class="checkbox-label lock-label">
                                <input type="checkbox" id="aspectLock" checked>
                                <span>Сохранять пропорции</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="actions">
                    <button class="btn btn-secondary" id="resetBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 .49-3.5"/>
                        </svg>
                        Новое изображение
                    </button>
                    <button class="btn btn-primary" id="downloadBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Скачать
                    </button>
                </div>

            </div>
        </main>

        <footer>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Конвертация происходит локально. Никакие данные не отправляются на сервер.
        </footer>

    </div>

    <div class="toast" id="toast"></div>

    <script src="https://unpkg.com/ag-psd@latest/dist/bundle.js"></script>
    <script src="script.js"></script>
</body>
</html>
